      applySettings();
    });
    el("opt-page-size").addEventListener("change", (e) => {
      state.settings.pageSize = Number(e.target.value);
      state.page = 1;
      saveSettings();
      renderTablePage();
    });
    el("opt-exclude-system").addEventListener("change", (e) => {
      state.settings.excludeSystem = Boolean(e.target.checked);
      saveSettings();
      if (state.serverOnline && !state.customDropMode) {
        reloadDrive();
      }
    });
    const showDelEl = el("opt-show-deleter");
    if (showDelEl) {
      showDelEl.addEventListener("change", (e) => {
        state.settings.showDeleter = Boolean(e.target.checked);
        saveSettings();
        applySettings();
      });
    }
    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY || e.key === "osiris_lang" || e.key === "osiris_theme") {
        const refreshed = loadSettings();
        if (e.key === "osiris_lang" && e.newValue) refreshed.lang = normalizeLang(e.newValue);
        if (e.key === "osiris_theme" && (e.newValue === "light" || e.newValue === "dark")) refreshed.theme = e.newValue;
        state.settings = refreshed;
        state.viewMode = refreshed.viewMode === "files" ? "files" : "folders";
        applySettings();
        applyFilterAndSort(false);
      }
    });

    el("search-input").addEventListener("input", (e) => {
      state.query = e.target.value;
      el("search-clear").style.display = state.query ? "inline" : "none";
      applyFilterAndSort(true);
    });
    el("search-clear").addEventListener("click", () => {
      state.query = "";
      el("search-input").value = "";
      el("search-clear").style.display = "none";
      applyFilterAndSort(true);
      el("search-input").focus();
    });
    el("search-scope").addEventListener("change", (e) => {
      state.searchScope = e.target.value;
      applyFilterAndSort(true);
    });

    const btnViewMode = el("btn-view-mode");
    if (btnViewMode) {
      btnViewMode.addEventListener("click", () => {
        state.viewMode = state.viewMode === "folders" ? "files" : "folders";
        state.settings.viewMode = state.viewMode;
        saveSettings();
        applySettings();
        applyFilterAndSort(true);
      });
    }

    const btnFoldAll = el("btn-fold-all");
    if (btnFoldAll) {
      btnFoldAll.addEventListener("click", () => {
        const allOpen = state.folderGroups.length > 0 && state.folderGroups.every(g => state.expandedFolders.has(g.key));
        if (allOpen) {
          state.expandedFolders.clear();
        } else {
          for (const g of state.folderGroups) state.expandedFolders.add(g.key);
        }
        updateFoldAllLabel();
        renderTablePage();
      });
    }

    const chkShowSub = el("chk-show-subfolders");
    if (chkShowSub) {
      chkShowSub.addEventListener("change", (e) => {
        state.settings.showSubfolders = Boolean(e.target.checked);
        state.expandedFolders.clear();
        saveSettings();
        const wrap = el("wrap-show-subfolders");
        if (wrap) wrap.classList.toggle("is-checked", state.settings.showSubfolders);
        applyFilterAndSort(true);
      });
    }

    const scrollToPageTop = () => {
      const ts = el("table-scroll");
      if (ts) {
        if (typeof ts.scrollTo === "function") {
          try { ts.scrollTo({ top: 0, behavior: "smooth" }); } catch (_) { ts.scrollTop = 0; }
        } else {
          ts.scrollTop = 0;
        }
      }
      try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (_) { window.scrollTo(0, 0); }
    };

    const updateTopBtnVisibility = () => {
      const btnTop = el("btn-scroll-top");
      if (!btnTop) return;
      const ts = el("table-scroll");
      const winY = window.pageYOffset || document.documentElement.scrollTop || 0;
      const tblY = ts ? ts.scrollTop : 0;
      btnTop.classList.toggle("show", winY > 120 || tblY > 120);
    };

    if (el("btn-scroll-top")) el("btn-scroll-top").addEventListener("click", scrollToPageTop);
    if (el("btn-scroll-top-bar")) el("btn-scroll-top-bar").addEventListener("click", scrollToPageTop);
    window.addEventListener("scroll", updateTopBtnVisibility, { passive: true });
    if (el("table-scroll")) el("table-scroll").addEventListener("scroll", updateTopBtnVisibility, { passive: true });

    el("cat-pills").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      state.category = btn.getAttribute("data-cat");
      renderCategoryPills();
      applyFilterAndSort(true);
    });

    document.querySelectorAll("thead th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.getAttribute("data-sort");
        if (state.sortKey === key) {
          state.sortDir *= -1;
        } else {
          state.sortKey = key;
          state.sortDir = key === "date" || key === "size" ? -1 : 1;
        }
        applyFilterAndSort(true);
      });
    });

    el("table-body").addEventListener("click", (e) => {
      const nameLink = e.target.closest("[data-idx]");
      if (nameLink) {
        e.preventDefault();
        openPlayerModal(Number(nameLink.getAttribute("data-idx")));
        return;
      }
      const pathLink = e.target.closest("[data-pidx]");
      if (pathLink) {
        const f = state.filtered[Number(pathLink.getAttribute("data-pidx"))];
        if (f) openFolderLocation(f.p);
        return;
      }
      const folderOpenLink = e.target.closest("[data-folder-open]");
      if (folderOpenLink) {
        e.stopPropagation();
        const fp = folderOpenLink.getAttribute("data-folder-open");
        if (fp) openFolderLocation(fp);
        return;
      }
      const folderRow = e.target.closest("[data-folder]");
      if (folderRow) {
        const fKey = folderRow.getAttribute("data-folder");
        if (fKey) {
          const ts = el("table-scroll");
          const prevScroll = ts ? ts.scrollTop : 0;
          if (state.expandedFolders.has(fKey)) {
            state.expandedFolders.delete(fKey);
          } else {
            state.expandedFolders.add(fKey);
          }
          renderTablePage();
          updateFoldAllLabel();
          if (ts) ts.scrollTop = prevScroll;
        }
      }
    });

    el("btn-prev-page").addEventListener("click", () => { state.page--; renderTablePage(); });
    el("btn-next-page").addEventListener("click", () => { state.page++; renderTablePage(); });

    el("btn-player-close").addEventListener("click", closePlayerModal);
    if (el("btn-pip-expand")) el("btn-pip-expand").addEventListener("click", restoreFloatingPiPToModal);
    if (el("btn-pip-close")) el("btn-pip-close").addEventListener("click", stopAllPiP);
    el("modal-player").addEventListener("click", (e) => {
      if (e.target === el("modal-player")) closePlayerModal();
    });
    el("btn-player-prev").addEventListener("click", () => {
      if (state.playerIdx > 0) openPlayerModal(state.playerIdx - 1);
    });
    el("btn-player-next").addEventListener("click", () => {
      if (state.playerIdx + 1 < state.filtered.length) openPlayerModal(state.playerIdx + 1);
    });
    el("btn-player-open-tab").addEventListener("click", () => {
      const f = state.filtered[state.playerIdx];
      if (f) window.open(getFileAccessUrl(f), "_blank", "noopener,noreferrer");
    });
    el("btn-player-open-dir").addEventListener("click", () => {
      const f = state.filtered[state.playerIdx];
      if (f) openFolderLocation(f.p);
    });

    document.addEventListener("keydown", (e) => {
      const ae = document.activeElement;
      const tag = ae && ae.tagName ? ae.tagName.toUpperCase() : "";
      const isTyping = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || (ae && ae.isContentEditable);

      if (!isTyping && e.key === "Delete") {
        e.preventDefault();
        const t = I18N[state.settings.lang] || I18N.EN;
        showToast(t.deleteProtectedToast, 2600);
        return;
      }

      if (!isTyping && ((e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"))) {
        e.preventDefault();
        const inp = el("search-input");
        if (inp) {
          inp.focus();
          inp.select();
        }
        return;
      }

      if (e.key === "Escape") {
        const inp = el("search-input");
        if (ae === inp && (state.query || (inp && inp.value))) {
          e.preventDefault();
          state.query = "";
          inp.value = "";
          el("search-clear").style.display = "none";
          applyFilterAndSort(true);
          return;
        }
        closePlayerModal();
        el("modal-param").classList.remove("open");
      }
    });
  }

  async function init() {
    startSessionHeartbeat();
    applySettings();
    wireEvents();
    const loc = detectLocationDrive();
    if (window.FILES_INDEX_DATA) {
      loadIndexPayload(window.FILES_INDEX_DATA);
    } else {
      applyFilterAndSort(true);
    }
    const targetRoot = (loc && loc.root) || state.serverDefaultRoot || (state.drive && state.drive.root) || "";
    const snapRoot = window.FILES_INDEX_DATA
      ? (window.FILES_INDEX_DATA.root || (window.FILES_INDEX_DATA.drive && window.FILES_INDEX_DATA.drive.root) || "")
      : "";
    const snapMismatch = Boolean(snapRoot && targetRoot && normalizeRootStr(snapRoot) !== normalizeRootStr(targetRoot));
    const shouldProbeOnLoad = location.protocol !== "file:" || !window.FILES_INDEX_DATA || snapMismatch;
    if (!shouldProbeOnLoad) return;
    const online = await detectServer(true);
    const finalTarget = (loc && loc.root) || state.serverDefaultRoot || (state.drive && state.drive.root) || "";
    if (online && (!window.FILES_INDEX_DATA || snapMismatch)) {
      await reloadDrive(finalTarget);
    }
  }

  init();
})();
</script>
</body>
</html>
