<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27%232563eb%27%20stroke-width%3D%272%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%279%27/%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%273%27/%3E%3C/svg%3E">
<title>FILES INDEXATION SYSTEM</title>
<style>
  :root {
    --bg-base: #eef2f7;
    --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #e2e8f0 100%);
    --bg-custom-image: none;
    --surface-rgb: 255, 255, 255;
    --surface-alt-rgb: 248, 250, 252;
    --header-rgb: 241, 245, 249;
    --surface-alpha: 0.92;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-strong: #1e293b;
    --border-soft: rgba(30, 41, 59, 0.22);
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-size: 14px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 18px 50px rgba(15, 23, 42, 0.22);
  }

  html[data-theme="dark"] {
    --bg-base: #0b1120;
    --bg-gradient: linear-gradient(135deg, #0b1120 0%, #111c33 100%);
    --surface-rgb: 15, 23, 42;
    --surface-alt-rgb: 22, 33, 56;
    --header-rgb: 26, 39, 66;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-strong: #475569;
    --border-soft: rgba(148, 163, 184, 0.24);
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --accent-soft: rgba(56, 189, 248, 0.15);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-family);
    font-size: var(--font-size);
    color: var(--text-main);
    background-color: var(--bg-base);
    background-image: var(--bg-custom-image), var(--bg-gradient);
    background-size: cover, cover;
    background-position: center, center;
    background-attachment: fixed, fixed;
    transition: color 0.2s ease, background-color 0.25s ease;
    overflow-x: hidden;
  }

  .app-shell {
    max-width: 1560px;
    margin: 14px auto;
    padding: 0 14px 28px;
    position: relative;
    z-index: 2;
  }

  .fixed-header-dock {
    position: sticky;
    top: 0;
    z-index: 45;
    padding-top: 8px;
    padding-bottom: 6px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .osiris-hint-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid var(--border-strong);
    border-radius: 8px;
    background: rgba(var(--header-rgb), 0.96);
    padding: 5px 10px;
    margin-bottom: 8px;
    box-shadow: var(--shadow-sm);
    min-width: 0;
  }

  .osiris-brand-prefix {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 6px;
    background: var(--accent);
    color: #ffffff;
    font-size: 0.78em;
    font-weight: 800;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .hints-ticker-viewport {
    flex: 1 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    white-space: nowrap;
    scrollbar-width: none;
    cursor: grab;
    min-width: 0;
    mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  }

  .hints-ticker-viewport::-webkit-scrollbar { display: none; }
  .hints-ticker-viewport:active { cursor: grabbing; }

  .hints-ticker-track {
    display: inline-flex;
    align-items: center;
    gap: 36px;
    padding-left: 8px;
    font-size: 0.82em;
    font-weight: 600;
    color: var(--text-muted);
    animation: osirisTickerScroll 52s linear infinite;
    will-change: transform;
  }

  .hints-ticker-viewport:hover .hints-ticker-track {
    animation-play-state: paused;
  }

  .hint-seg {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .hint-lang-tag {
    font-size: 0.78em;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  @keyframes osirisTickerScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .collapsed-mini-disk {
    font-size: 0.78em;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.9);
    color: var(--text-main);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .blueprint-header {
    display: grid;
    grid-template-columns: minmax(220px, 1.35fr) minmax(240px, 1.15fr) minmax(300px, 2fr);
    grid-template-rows: auto auto;
    border: 2px solid var(--border-strong);
    background: rgba(var(--surface-rgb), var(--surface-alpha));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow-sm);
    border-radius: 8px;
    overflow: hidden;
    max-height: 700px;
    opacity: 1;
    transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.25s ease, padding 0.25s ease, border-width 0.22s ease;
  }

  .fixed-header-dock.is-collapsed .blueprint-header {
    max-height: 0;
    opacity: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-width: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .hdr-cell {
    border: 1px solid var(--border-strong);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .cell-reload {
    grid-column: 1;
    grid-row: 1;
    justify-content: space-between;
    background: rgba(var(--header-rgb), var(--surface-alpha));
  }

  .cell-disk {
    grid-column: 1;
    grid-row: 2;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 5px;
    background: rgba(var(--surface-alt-rgb), var(--surface-alpha));
  }

  .cell-monolith {
    grid-column: 2;
    grid-row: 1 / span 2;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    background: rgba(var(--surface-rgb), var(--surface-alpha));
    padding: 12px 16px;
    position: relative;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }

  .cell-monolith:hover {
    background: var(--accent-soft);
  }

  .cell-monolith:active {
    transform: scale(0.97);
  }

  .monolith-title {
    margin: 0;
    font-size: clamp(1rem, 1.8vw, 1.35rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.25;
    text-transform: uppercase;
    word-break: break-word;
  }

  .cell-controls {
    grid-column: 3;
    grid-row: 1;
    justify-content: space-around;
    flex-wrap: wrap;
    background: rgba(var(--header-rgb), var(--surface-alpha));
  }

  .cell-toolbar {
    grid-column: 3;
    grid-row: 2;
    justify-content: stretch;
    background: rgba(var(--surface-alt-rgb), var(--surface-alpha));
  }

  .hdr-btn {
    border: 1.5px solid var(--border-strong);
    background: rgba(var(--surface-rgb), 0.9);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .hdr-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    transform: translateY(-1px);
  }

  .hdr-btn:active { transform: translateY(0); }

  .svg-ico {
    width: 1.05em;
    height: 1.05em;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    vertical-align: -0.15em;
    flex-shrink: 0;
  }

  @keyframes icoSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .is-spinning .svg-ico {
    animation: icoSpin 0.8s linear infinite;
  }

  .hdr-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .hdr-btn.primary:hover {
    background: var(--accent-hover);
  }

  .disk-top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.84em;
    font-weight: 700;
  }

  .disk-label-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .disk-kind-badge {
    font-size: 0.72em;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .disk-select {
    font-family: inherit;
    font-size: 0.92em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.95);
    color: var(--text-main);
    cursor: pointer;
  }

  .disk-bar-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--border-soft);
    overflow: hidden;
  }

  .disk-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    transition: width 0.35s ease;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75em;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.85);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f59e0b;
  }

  .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

  .delete-shield {
    cursor: pointer;
    border-color: rgba(22, 163, 74, 0.45);
    color: var(--success);
    background: rgba(22, 163, 74, 0.1);
    white-space: nowrap;
  }

  .hdr-btn.deleter-shortcut {
    border-color: rgba(225, 29, 72, 0.58);
    color: #be123c;
    background: rgba(244, 63, 94, 0.11);
  }
  [data-theme="dark"] .hdr-btn.deleter-shortcut {
    border-color: rgba(251, 113, 133, 0.55);
    color: #fb7185;
    background: rgba(244, 63, 94, 0.16);
  }
  .hdr-btn.deleter-shortcut:hover {
    background: linear-gradient(135deg, #f43f5e, #dc2626);
    border-color: #e11d48;
    color: #ffffff;
  }

  .cell-reload { flex-wrap: wrap; }

  .filter-ribbon {
    margin-top: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    background: rgba(var(--surface-rgb), var(--surface-alpha));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: var(--shadow-sm);
  }

  .search-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .search-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78em;
    font-weight: 800;
    letter-spacing: 0.05em;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--border-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .search-box {
    flex: 1 1 150px;
    position: relative;
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .search-input {
    width: 100%;
    padding: 6px 28px 6px 10px;
    border-radius: 6px;
    border: 1.5px solid var(--border-strong);
    background: rgba(var(--surface-rgb), 0.96);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.9em;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .search-clear {
    position: absolute;
    right: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    display: none;
    padding: 2px 4px;
  }

  .search-clear:hover { color: var(--danger); }

  .search-scope {
    font-family: inherit;
    font-size: 0.78em;
    font-weight: 700;
    padding: 6px 7px;
    border-radius: 6px;
    border: 1.5px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.96);
    color: var(--text-main);
    cursor: pointer;
    flex-shrink: 0;
  }

  .search-count {
    font-size: 0.75em;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.9);
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .search-count.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  mark.search-hl {
    background: rgba(250, 204, 21, 0.45);
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
    font-weight: 700;
  }

  html[data-theme="dark"] mark.search-hl {
    background: rgba(250, 204, 21, 0.32);
    color: #fef08a;
  }

  .cat-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    -webkit-overflow-scrolling: touch;
  }

  .cat-pill {
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-alt-rgb), 0.85);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.78em;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cat-pill:hover { border-color: var(--accent); color: var(--text-main); }
  .cat-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .table-frame {
    margin-top: 10px;
    border: 2px solid var(--border-strong);
    border-radius: 8px;
    background: rgba(var(--surface-rgb), var(--surface-alpha));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(100vh - 285px);
    max-height: calc(100dvh - 285px);
    min-height: 280px;
    transition: max-height 0.25s ease;
  }

  .app-shell.header-collapsed .table-scroll {
    max-height: calc(100vh - 155px);
    max-height: calc(100dvh - 155px);
  }

  table.idx-table {
    width: 100%;
    min-width: 680px;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.idx-table thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(var(--header-rgb), 0.96);
    border-bottom: 2px solid var(--border-strong);
    border-right: 1px solid var(--border-soft);
    padding: 10px 10px;
    text-align: left;
    font-size: 0.86em;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }

  table.idx-table thead th:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  table.idx-table thead th .sort-arrow {
    margin-left: 6px;
    font-size: 0.85em;
    opacity: 0.75;
  }

  table.idx-table tbody tr {
    border-bottom: 1px solid var(--border-soft);
    transition: background-color 0.12s ease;
  }

  table.idx-table tbody tr:hover {
    background: var(--accent-soft);
  }

  table.idx-table td {
    padding: 7px 10px;
    border-right: 1px solid var(--border-soft);
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  col.col-name { width: 28%; }
  col.col-date { width: 14%; }
  col.col-size { width: 17%; }
  col.col-type { width: 11%; }
  col.col-path { width: 30%; }

  .link-name {
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    text-decoration: none;
  }

  .link-name:hover { text-decoration: underline; }

  .link-path {
    color: var(--text-muted);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.86em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    overflow: hidden;
  }

  .link-path-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .link-path:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .t-video { background: rgba(239, 68, 68, 0.16); color: #ef4444; }
  .t-audio { background: rgba(168, 85, 247, 0.16); color: #a855f7; }
  .t-image { background: rgba(16, 185, 129, 0.16); color: #10b981; }
  .t-pdf   { background: rgba(244, 63, 94, 0.16); color: #e11d48; }
  .t-doc   { background: rgba(59, 130, 246, 0.16); color: #3b82f6; }
  .t-code  { background: rgba(14, 165, 233, 0.16); color: #0284c7; }
  .t-archive { background: rgba(245, 158, 11, 0.16); color: #d97706; }
  .t-exe   { background: rgba(234, 88, 12, 0.16); color: #ea580c; }
  .t-other { background: rgba(100, 116, 139, 0.16); color: #64748b; }

  .size-meter-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .size-meter-track {
    flex: 1 1 auto;
    height: 9px;
    border-radius: 4px;
    background: var(--border-soft);
    overflow: hidden;
    min-width: 48px;
  }

  .size-meter-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #38bdf8, #2563eb);
  }

  .size-unit-pill {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.8em;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }

  .pagination-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-top: 1px solid var(--border-soft);
    background: rgba(var(--header-rgb), 0.9);
    gap: 8px;
    font-size: 0.88em;
  }

  .pag-btns { display: flex; gap: 6px; align-items: center; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.68);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }

  .modal-backdrop.open { display: flex; }

  .modal-card {
    width: min(720px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: rgba(var(--surface-rgb), 0.98);
    color: var(--text-main);
    border: 2px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    padding: 18px 20px;
  }

  .modal-card.wide { width: min(1040px, 100%); }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }

  .modal-head h3 {
    margin: 0;
    font-size: 1.1em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .form-row {
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row label {
    font-weight: 700;
    font-size: 0.88em;
    color: var(--text-muted);
  }

  .form-ctrl {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1.5px solid var(--border-soft);
    background: rgba(var(--surface-alt-rgb), 0.95);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.95em;
  }

  .player-stage {
    background: #020617;
    border-radius: 8px;
    min-height: 300px;
    max-height: 62vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .player-stage video {
    width: 100%;
    max-height: 55vh;
    outline: none;
  }

  .video-ctrl-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 7px 10px;
    width: 100%;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    border-top: 1px solid rgba(148, 163, 184, 0.2);
  }

  .video-ctrl-bar .hdr-btn {
    border-color: #475569;
    background: rgba(30, 41, 59, 0.92);
    color: #f1f5f9;
    padding: 4px 10px;
    font-size: 0.8em;
  }

  .video-ctrl-bar .hdr-btn.spd-active,
  .video-ctrl-bar .hdr-btn.pip-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .floating-pip-dock {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: min(360px, calc(100vw - 24px));
    z-index: 220;
    display: none;
    flex-direction: column;
    border: 2px solid var(--accent);
    border-radius: 10px;
    overflow: hidden;
    background: #020617;
    box-shadow: var(--shadow-lg);
  }
  .floating-pip-dock.open { display: flex; }
  .floating-pip-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    background: #0f172a;
    color: #f8fafc;
    border-bottom: 1px solid rgba(148, 163, 184, 0.25);
  }
  .floating-pip-title {
    font-size: 0.78em;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .floating-pip-btns {
    display: inline-flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .floating-pip-btns .hdr-btn {
    padding: 3px 6px;
    font-size: 0.76em;
    border-color: #475569;
    background: rgba(30, 41, 59, 0.95);
    color: #f8fafc;
  }
  .floating-pip-body video {
    width: 100%;
    max-height: 220px;
    display: block;
    background: #000000;
  }

  .unreadable-stage-card {
    color: #f8fafc;
    padding: 28px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 560px;
  }
  .unreadable-stage-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.78em;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(148, 163, 184, 0.16);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.42);
  }

  .player-stage img {
    max-width: 100%;
    max-height: 60vh;
    object-fit: contain;
    transition: transform 0.2s ease;
  }

  .player-stage iframe {
    width: 100%;
    height: 60vh;
    border: none;
    background: #ffffff;
  }

  .player-stage pre {
    width: 100%;
    height: 55vh;
    margin: 0;
    padding: 14px;
    overflow: auto;
    color: #e2e8f0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .audio-stage {
    padding: 28px 20px;
    width: 100%;
    text-align: center;
    color: #f8fafc;
  }

  .eq-bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 5px;
    height: 44px;
    margin-bottom: 18px;
  }

  .eq-bars span {
    width: 7px;
    background: #38bdf8;
    border-radius: 4px;
    animation: eqPulse 0.9s ease-in-out infinite alternate;
  }
  .eq-bars span:nth-child(2) { animation-delay: 0.15s; height: 65%; }
  .eq-bars span:nth-child(3) { animation-delay: 0.3s; height: 95%; }
  .eq-bars span:nth-child(4) { animation-delay: 0.45s; height: 50%; }
  .eq-bars span:nth-child(5) { animation-delay: 0.6s; height: 80%; }

  @keyframes eqPulse {
    from { transform: scaleY(0.25); opacity: 0.6; }
    to   { transform: scaleY(1); opacity: 1; }
  }

  .player-footer {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .hdr-btn.view-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .subfolders-toggle {
    border: 1.5px solid var(--border-strong);
    background: rgba(var(--surface-rgb), 0.9);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .subfolders-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .subfolders-toggle.is-checked {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .subfolders-toggle input[type="checkbox"] {
    margin: 0;
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  tr.folder-group-row {
    background: rgba(var(--header-rgb), 0.72);
    cursor: pointer;
    font-weight: 700;
  }
  tr.folder-group-row:hover {
    background: var(--accent-soft);
  }
  tr.folder-group-row.is-open {
    border-left: 3px solid var(--accent);
  }
  .folder-toggle-wrap {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
    overflow: hidden;
  }
  .folder-depth-branch {
    color: var(--text-muted);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.88em;
    flex-shrink: 0;
  }
  .folder-name-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder-count-pill {
    font-size: 0.78em;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .folder-sub-pill {
    font-size: 0.74em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: rgba(var(--surface-rgb), 0.85);
    color: var(--text-muted);
    white-space: nowrap;
    margin-left: 4px;
  }
  tr.folder-child-row td:first-child {
    padding-left: 30px;
    border-left: 3px solid rgba(59, 130, 246, 0.35);
  }

  .scroll-top-btn {
    position: fixed;
    right: 22px;
    bottom: 66px;
    z-index: 180;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #ffffff;
    font-family: inherit;
    font-size: 0.84em;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease, background-color 0.15s ease;
  }
  .scroll-top-btn.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .scroll-top-btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    transform: translateY(-2px);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 200;
    background: var(--border-strong);
    color: #ffffff;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9em;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: all 0.25s ease;
    max-width: 440px;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  #fx-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 150;
    display: none;
  }

  @keyframes animBarrelRoll {
    0%   { transform: perspective(900px) rotate(0deg) scale(1); }
    45%  { transform: perspective(900px) rotate(360deg) scale(0.92); }
    75%  { transform: perspective(900px) rotate(360deg) scale(1.03); }
    100% { transform: perspective(900px) rotate(360deg) scale(1); }
  }
  .fx-barrel { animation: animBarrelRoll 1.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes animZeroGravRow {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-10px) rotate(1.2deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .fx-zerog tbody tr { animation: animZeroGravRow 1.1s ease-in-out infinite alternate; }
  .fx-zerog tbody tr:nth-child(even) { animation-direction: alternate-reverse; }

  @keyframes animDisco {
    0%   { filter: hue-rotate(0deg) saturate(1.4); }
    50%  { filter: hue-rotate(180deg) saturate(1.8); }
    100% { filter: hue-rotate(360deg) saturate(1); }
  }
  .fx-disco { animation: animDisco 0.9s linear 3; }

  @keyframes animGlitch {
    0%, 100% { transform: translate(0); filter: none; }
    20% { transform: translate(-5px, 2px); filter: drop-shadow(3px 0 #ff0055) drop-shadow(-3px 0 #00ffcc); }
    40% { transform: translate(5px, -2px) skewX(2deg); filter: drop-shadow(-4px 0 #ff0055); }
    60% { transform: translate(-3px, 3px); filter: drop-shadow(4px 0 #00ccff); }
    80% { transform: translate(3px, -1px) skewX(-2deg); }
  }
  .fx-glitch { animation: animGlitch 0.35s steps(2, end) 6; }

  @keyframes animJelly {
    0%   { transform: scale3d(1, 1, 1); }
    30%  { transform: scale3d(1.12, 0.85, 1); }
    50%  { transform: scale3d(0.88, 1.12, 1); }
    70%  { transform: scale3d(1.05, 0.95, 1); }
    100% { transform: scale3d(1, 1, 1); }
  }
  .fx-jelly { animation: animJelly 0.9s ease 2; }

  @keyframes animEarthquake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-8px, 4px) rotate(-0.8deg); }
    40% { transform: translate(8px, -5px) rotate(0.8deg); }
    60% { transform: translate(-6px, -3px) rotate(-0.5deg); }
    80% { transform: translate(6px, 4px) rotate(0.5deg); }
  }
  .fx-quake { animation: animEarthquake 0.28s linear 8; }

  .pacman-runner {
    position: fixed;
    top: 24px;
    left: -60px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: conic-gradient(from 40deg, #facc15 0deg 280deg, transparent 280deg 360deg);
    z-index: 160;
    pointer-events: none;
    animation: pacRun 2.2s linear forwards, pacChomp 0.22s infinite alternate;
  }
  @keyframes pacRun {
    from { left: -60px; }
    to   { left: calc(100vw + 60px); }
  }
  @keyframes pacChomp {
    from { clip-path: polygon(50% 50%, 100% 20%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 80%); }
    to   { clip-path: polygon(50% 50%, 100% 48%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 52%); }
  }

  @media (hover: none) {
    body { background-attachment: scroll, scroll; }
  }
  @media (max-width: 960px) {
    body { background-attachment: scroll, scroll; }
    .blueprint-header {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      max-height: 1200px;
    }
    .cell-reload, .cell-disk, .cell-monolith, .cell-controls, .cell-toolbar {
      grid-column: 1;
      grid-row: auto;
    }
  }
  @media (max-height: 540px) {
    .fixed-header-dock { position: relative; }
    .table-scroll { max-height: 62vh; }
  }
  @media (max-width: 640px) {
    .app-shell { margin: 6px auto; padding: 0 8px 20px; }
    .hdr-cell { padding: 6px 8px; }
    .osiris-hint-bar { flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
    .hints-ticker-viewport { flex: 1 1 100%; order: 3; }
    #btn-collapse-header { margin-left: auto; }
    .search-wrap { flex-wrap: wrap; }
    .cat-pills { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; padding-bottom: 2px; }
    .cat-pills::-webkit-scrollbar { display: none; }
    .cell-controls, .pag-btns { flex-wrap: wrap; gap: 6px; }
    .modal-backdrop { padding: 8px; }
    .modal-card { padding: 14px; }
  }
  @media (max-width: 480px) {
    .pagination-bar, .player-footer { flex-direction: column; align-items: stretch; }
    .pag-btns { justify-content: space-between; }
    .search-badge { padding: 5px 6px; font-size: 0.72em; }
    .scroll-top-btn { right: 12px; bottom: 16px; padding: 7px 11px; font-size: 0.78em; }
    .toast { left: 10px; right: 10px; bottom: 10px; max-width: none; }
  }

  .drop-overlay {
    position: fixed;
    inset: 0;
    z-index: 250;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.74);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: 24px;
    pointer-events: none;
  }

  .drop-overlay.open { display: flex; }

  .drop-card {
    max-width: 480px;
    width: 100%;
    padding: 34px 28px;
    border-radius: 14px;
    border: 2.5px dashed var(--accent);
    background: rgba(var(--surface-rgb), 0.96);
    color: var(--text-main);
    text-align: center;
    box-shadow: var(--shadow-lg);
  }

  .drop-card .drop-ico {
    width: 46px;
    height: 46px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .drop-card h3 {
    margin: 0 0 6px;
    font-size: 1.15em;
  }

  .drop-card p {
    margin: 0;
    font-size: 0.9em;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<canvas id="fx-canvas"></canvas>

<div class="app-shell" id="app-shell">
  <div class="fixed-header-dock" id="fixed-header-dock">
    <div class="osiris-hint-bar" id="osiris-hint-bar">
      <span class="osiris-brand-prefix" id="osiris-brand-prefix">
        <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/></svg>
        <span>Osiris portable files indexer</span>
      </span>
      <div class="hints-ticker-viewport" id="hints-ticker-viewport" title="Scroll horizontally or hover to pause hints">
        <div class="hints-ticker-track" id="hints-ticker-track"></div>
      </div>
      <span class="collapsed-mini-disk" id="collapsed-mini-disk" style="display:none;"></span>
      <button class="hdr-btn" id="btn-collapse-header" title="Collapse / Expand Header">
        <span id="icon-collapse-header"></span>
        <span id="lbl-collapse-header">Collapse</span>
      </button>
    </div>
    <header class="blueprint-header">
    <div class="hdr-cell cell-reload">
      <button class="hdr-btn primary" id="btn-reload" title="Reload / Rescan drive">
        <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        <span id="lbl-reload">RELOAD</span>
      </button>
      <span class="status-pill" id="server-status">
        <span class="status-dot" id="server-dot"></span>
        <span id="server-text">SNAPSHOT</span>
      </span>
      <span class="status-pill delete-shield" id="delete-protection-badge" title="Delete protection active (Read-Only)">
        <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="lbl-delete-protected">READ-ONLY</span>
      </span>
    </div>

    <div class="hdr-cell cell-disk">
      <div class="disk-top-row">
        <span class="disk-label-wrap">
          <span id="disk-icon"><svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg></span>
          <span id="disk-label">--</span>
          <span class="disk-kind-badge" id="disk-kind-badge" style="display:none;"></span>
        </span>
        <select class="disk-select" id="drive-select" title="Select Drive"></select>
        <span id="disk-size-summary">-- / --</span>
      </div>
      <div class="disk-bar-track">
        <div class="disk-bar-fill" id="disk-bar-fill"></div>
      </div>
    </div>

    <div class="hdr-cell cell-monolith" id="btn-monolith" title="Click for a surprise animation!">
      <h1 class="monolith-title" id="monolith-title">FILES<br>INDEXATION<br>SYSTEM</h1>
    </div>

    <div class="hdr-cell cell-controls">
      <button class="hdr-btn" id="btn-lang" title="Toggle Language FR / DE / EN">
        <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span id="lbl-lang">EN</span>
      </button>
      <button class="hdr-btn" id="btn-param" title="Settings">
        <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
        <span id="lbl-param">PARAM.</span>
      </button>
      <button class="hdr-btn" id="btn-theme" title="Toggle Light / Dark theme">
        <span id="icon-theme"><svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
        <span id="lbl-theme">LIGHT</span>
      </button>
    </div>

    <div class="hdr-cell cell-toolbar">
      <div class="search-wrap">
        <span class="search-badge" title="Press / or Ctrl+K to search"><svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span id="search-label">SEARCH</span></span>
        <div class="search-box">
          <input type="text" class="search-input" id="search-input" placeholder="Search name, type, or path... (/)" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="search-clear" title="Clear search"><svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></button>
        </div>
        <select class="search-scope" id="search-scope" title="Search scope">
          <option value="all" id="opt-scope-all">ALL</option>
          <option value="name" id="opt-scope-name">NAME</option>
          <option value="type" id="opt-scope-type">TYPE</option>
          <option value="path" id="opt-scope-path">PATH</option>
        </select>
        <span class="search-count" id="search-count">0</span>
      </div>
    </div>

<script>
(function() {
  "use strict";

  const SERVER_ORIGIN = (location.protocol === "http:" || location.protocol === "https:")
    ? location.origin
    : "http://127.0.0.1:8765";
  const OSIRIS_TOKEN = (document.querySelector('meta[name="osiris-token"]') || {}).content || "";
  const SESSION_TAB_ID = "idx_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
  let sessionCloseSent = false;
  let sessionHeartbeatTimer = null;
  let sessionHeartbeatWired = false;

  function sendSessionHeartbeat(mode = "alive") {
    if (!OSIRIS_TOKEN) return;
    if (mode === "closing") {
      if (sessionCloseSent) return;
      sessionCloseSent = true;
    } else {
      sessionCloseSent = false;
    }
    try {
      fetch(`${SERVER_ORIGIN}/api/heartbeat`, {
        method: "POST",
        keepalive: mode === "closing",
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "X-Osiris-Token": OSIRIS_TOKEN
        },
        body: JSON.stringify({ tab_id: SESSION_TAB_ID, state: mode })
      }).catch(() => {});
    } catch (_) {}
  }

  function startSessionHeartbeat() {
    if (!OSIRIS_TOKEN) return;
    sendSessionHeartbeat("alive");
    if (sessionHeartbeatTimer) clearInterval(sessionHeartbeatTimer);
    sessionHeartbeatTimer = setInterval(() => sendSessionHeartbeat("alive"), 10000);
    if (!sessionHeartbeatWired) {
      sessionHeartbeatWired = true;
      window.addEventListener("pagehide", () => sendSessionHeartbeat("closing"));
      window.addEventListener("beforeunload", () => sendSessionHeartbeat("closing"));
      window.addEventListener("pageshow", () => sendSessionHeartbeat("alive"));
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") sendSessionHeartbeat("alive");
      });
    }
  }

  const SAFE_DATA_IMG_RE = /^data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/;

  function normalizeLang(rawLang) {
    const up = String(rawLang || "").trim().toUpperCase();
    return I18N[up] ? up : "EN";
  }

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const merged = Object.assign({}, DEFAULT_SETTINGS, saved);
      merged.lang = normalizeLang(merged.lang);
      merged.showDeleter = Boolean(merged.showDeleter);
      if (typeof saved.showSubfolders !== "boolean") {
        merged.viewMode = "folders";
        merged.showSubfolders = false;
      } else {
        merged.showSubfolders = Boolean(saved.showSubfolders);
      }
      return merged;
    } catch (_) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettings() {
    try {
      const toStore = Object.assign({}, state.settings);
      toStore.lang = normalizeLang(toStore.lang);
      if (toStore.bgCustomUrl && toStore.bgCustomUrl.length > 200000) {
        toStore.bgCustomUrl = "";
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
      localStorage.setItem("osiris_lang", toStore.lang);
      localStorage.setItem("osiris_theme", toStore.theme === "dark" ? "dark" : "light");
    } catch (_) {}
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({

    }[m]));

  function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function highlightText(str, query) {
    const raw = String(str || "");
    const tokens = String(query || "").trim().split(/\s+/).filter(Boolean);
    if (!tokens.length) return escapeHtml(raw);
    const uniq = Array.from(new Set(tokens.map(t => t.toLowerCase())))
      .sort((a, b) => b.length - a.length)
      .map(escapeRegExp);
    if (!uniq.length) return escapeHtml(raw);
    const re = new RegExp("(" + uniq.join("|") + ")", "gi");
    let res = "";
    let lastIdx = 0;
    let match;
    while ((match = re.exec(raw)) !== null) {
      if (match.index > lastIdx) {
        res += escapeHtml(raw.slice(lastIdx, match.index));
      }
      res += `<mark class="search-hl">${escapeHtml(match[0])}</mark>`;
      lastIdx = re.lastIndex;
      if (match[0].length === 0) {
        re.lastIndex++;
      }
    }
    if (lastIdx < raw.length) {
      res += escapeHtml(raw.slice(lastIdx));
    }
    return res;
  }

  function loadIndexPayload(payload) {
    state.rawData = payload;
    const rawFiles = Array.isArray(payload && payload.files) ? payload.files : [];
    state.files = Object.freeze(rawFiles.map(item => (item && typeof item === "object" ? Object.freeze(item) : item)));
    state.drive = (payload && payload.drive) || null;
    state.drives = (payload && payload.drives) || [];
    state.expandedFolders.clear();
    state.runtimeUnreadable.clear();
    let maxS = 1;
    for (let i = 0; i < state.files.length; i++) {
      if (state.files[i].s > maxS) maxS = state.files[i].s;

    state.maxFileSize = maxS;

    renderDriveInfo();
    applyFilterAndSort(true);

  function findDriveByLetter(letter) {

    const loc = detectLocationDrive();

    if (!state.manualDriveSwitch && !state.customDropMode && loc) {

      if (!curStr.startsWith(loc.letter + ":")) {
        const matched = findDriveByLetter(loc.letter);
        if (matched) return matched;
        if (state.serverHostDrive && String(state.serverHostDrive.drive || "").toUpperCase().startsWith(loc.letter + ":")) {
          return state.serverHostDrive;
        }
        return { drive: loc.drive, root: loc.root, total: 0, used: 0, free: 0, percent_used: 0, label: "", kind: "unknown" };
      }
    }
    if (d) return d;
    if (state.serverHostDrive) return state.serverHostDrive;
    if (loc) {
      return findDriveByLetter(loc.letter) || { drive: loc.drive, root: loc.root, total: 0, used: 0, free: 0, percent_used: 0, label: "", kind: "unknown" };
    }
    return null;

  function renderDriveInfo() {
    const t = I18N[state.settings.lang] || I18N.EN;

      sel.innerHTML = state.drives.map(dr => {

    } else {

    el("index-stats").textContent = `${state.files.length.toLocaleString()} ${t.filesLabel} · ${formatBytes(totSize, state.settings.lang)}`;

    const miniDisk = el("collapsed-mini-disk");

          ? `${drvTxt} · ${d.percent_used}% (${formatBytes(d.used, state.settings.lang)} / ${formatBytes(d.total, state.settings.lang)})`

  function renderCategoryPills() {
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    const counts = { all: state.files.length, unreadable: 0 };
    for (const f of state.files) {
      counts[f.t] = (counts[f.t] || 0) + 1;
      if (!isIndexerReadable(f)) counts.unreadable++;
    }
    const order = ["all", "video", "audio", "image", "pdf", "doc", "code", "archive", "exe", "other", "unreadable"];
    const html = order
      .filter(k => k === "all" || (counts[k] || 0) > 0)
      .map(k => {
        const cls = state.category === k ? "cat-pill active" : "cat-pill";
        const lbl = t.cats[k] || k.toUpperCase();
        const ico = SVG_ICONS[k] || SVG_ICONS.other;
        const tipAttr = k === "unreadable" ? ` title="${escapeHtml(t.unreadableTip)}"` : "";
        return `<button class="${cls}" data-cat="${k}"${tipAttr} style="display:inline-flex;align-items:center;gap:5px;">${ico}<span>${escapeHtml(lbl)} (${counts[k] || 0})</span></button>`;
      }).join("");
    el("cat-pills").innerHTML = html;
  }

  function applyFilterAndSort(resetPage = false) {
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const cat = state.category;
    const scope = state.searchScope || "all";
    const out = [];
    for (let i = 0; i < state.files.length; i++) {
      const f = state.files[i];
      if (cat === "unreadable") {
        if (isIndexerReadable(f)) continue;
      } else if (cat !== "all" && f.t !== cat) {
        continue;
      }
      if (tokens.length) {
        const typeStr = `${t.cats[f.t] || f.t || ""} ${f.t || ""} ${f.e || ""}`;
        let hay = "";
        if (scope === "name") {
          hay = (f.n || "").toLowerCase();
        } else if (scope === "type") {
          hay = typeStr.toLowerCase();
        } else if (scope === "path") {
          hay = (f.p || "").toLowerCase();
        } else {
          hay = `${f.n || ""} ${f.p || ""} ${typeStr}`.toLowerCase();
        }
        let allMatch = true;
        for (let k = 0; k < tokens.length; k++) {
          if (!hay.includes(tokens[k])) {
            allMatch = false;
            break;
          }
        }
        if (!allMatch) continue;
      }
      out.push(f);
    }

    const dir = state.sortDir;
    const key = state.sortKey;
    out.sort((a, b) => {
      if (key === "name") return dir * natCmp(a.n, b.n);
      if (key === "date") return dir * (a.d - b.d);
      if (key === "size") return dir * (a.s - b.s);
      if (key === "type") return dir * natCmp(a.t + a.e, b.t + b.e);
      return dir * natCmp(a.p, b.p);
    });

    state.filtered = out;
    state.filteredIdxMap = new Map();
    for (let i = 0; i < out.length; i++) {
      state.filteredIdxMap.set(out[i], i);
    }
    buildFolderGroups(out);
    const countNode = el("search-count");
    if (countNode) {
      if (tokens.length) {
        countNode.textContent = `${out.length.toLocaleString()} / ${state.files.length.toLocaleString()}`;
        countNode.classList.add("active");
      } else {
        countNode.textContent = out.length.toLocaleString();
        countNode.classList.remove("active");
      }
    }
    if (resetPage) state.page = 1;
    renderSortArrows();
    renderTablePage();
  }

  function buildFolderGroups(fileList) {
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    const showSub = Boolean(state.settings.showSubfolders);
    const map = new Map();
    for (let i = 0; i < fileList.length; i++) {
      const f = fileList[i];
      const rel = String(f.r || f.p || f.n || "");
      const normRel = rel.replace(/\\/g, "/");
      const firstSlash = normRel.indexOf("/");
      const lastSlash = normRel.lastIndexOf("/");
      const normFull = String(f.p || "").replace(/\\/g, "/");
      const fullSlash = normFull.lastIndexOf("/");
      const basePrefix = normFull.endsWith(normRel)
        ? normFull.slice(0, normFull.length - normRel.length)
        : "";
      let folderKey = "__ROOT__";
      let folderRel = "";
      let folderFull = basePrefix || (fullSlash > 0 ? normFull.slice(0, fullSlash + 1) : normFull);
      let folderName = `${t.rootFolder}${folderFull ? " (" + folderFull + ")" : ""}`;
      let depth = 0;
      let leafRel = "";

      if (firstSlash > 0) {
        leafRel = normRel.slice(0, lastSlash);
        if (showSub) {
          folderRel = leafRel;
          folderKey = folderRel;
          folderFull = basePrefix ? (basePrefix + folderRel) : (fullSlash > 0 ? normFull.slice(0, fullSlash) : folderRel);
          const parts = folderRel.split("/");
          depth = parts.length - 1;
          folderName = parts[parts.length - 1];
        } else {
          folderRel = normRel.slice(0, firstSlash);
          folderKey = folderRel;
          folderFull = basePrefix ? (basePrefix + folderRel) : folderRel;
          depth = 0;
          folderName = folderRel;
        }
      }

      let grp = map.get(folderKey);
      if (!grp) {
        grp = {
          key: folderKey,
          name: folderName,
          rel: folderRel,
          fullPath: folderFull,
          depth,
          subfolders: new Set(),
          totalSize: 0,
          maxDate: 0,
          files: []
        };
        map.set(folderKey, grp);
      }
      if (!showSub && leafRel && leafRel !== folderRel) {
        const subParts = leafRel.split("/");
        let acc = subParts[0];
        for (let sIdx = 1; sIdx < subParts.length; sIdx++) {
          acc += "/" + subParts[sIdx];
          grp.subfolders.add(acc);
        }
      }
      grp.files.push(f);
      grp.totalSize += (f.s || 0);
      if ((f.d || 0) > grp.maxDate) grp.maxDate = f.d || 0;
    }

    const groups = Array.from(map.values());
    if (showSub) {
      for (let i = 0; i < groups.length; i++) {
        const g = groups[i];
        if (g.depth > 0) {
          const pSlash = g.rel.lastIndexOf("/");
          const parentKey = pSlash > 0 ? g.rel.slice(0, pSlash) : "";
          g.parentListed = Boolean(parentKey && map.has(parentKey));
          g.displayName = g.parentListed ? g.name : g.rel.replace(/\//g, " / ");
        } else {
          g.parentListed = false;
          g.displayName = g.name;
        }
      }
    } else {
      for (let i = 0; i < groups.length; i++) {
        groups[i].parentListed = false;
        groups[i].displayName = groups[i].name;
      }
    }

    const dir = state.sortDir;
    const key = state.sortKey;
    groups.sort((a, b) => {
      if (key === "date") return dir * (a.maxDate - b.maxDate);
      if (key === "size") return dir * (a.totalSize - b.totalSize);
      if (key === "type") return dir * (a.files.length - b.files.length);
      if (a.key === "__ROOT__" && b.key !== "__ROOT__") return -1 * dir;
      if (b.key === "__ROOT__" && a.key !== "__ROOT__") return 1 * dir;
      if (showSub) {
        return dir * natCmp(a.rel, b.rel);
      }
      if (key === "path") return dir * natCmp(a.fullPath, b.fullPath);
      return dir * natCmp(a.name, b.name);
    });
    state.folderGroups = groups;
    updateFoldAllLabel();
  }

  function renderSortArrows() {
    for (const k of ["name", "date", "size", "type", "path"]) {
      const node = el("arr-" + k);
      if (!node) continue;
      if (state.sortKey === k) {
        node.innerHTML = state.sortDir > 0 ? SVG_ICONS.sortAsc : SVG_ICONS.sortDesc;
      } else {
        node.innerHTML = SVG_ICONS.sortIdle;
      }
    }
  }

  function renderSizeCell(bytes) {
    const mode = state.settings.sizeMode;
    const lang = normalizeLang(state.settings.lang);
    const letterText = formatBytes(bytes, lang);
    const diskTotal = (state.drive && state.drive.total > 0)
      ? state.drive.total
      : Math.max(1, state.rawData && state.rawData.total_size ? state.rawData.total_size : 1);
    const pct = ((bytes / diskTotal) * 100);
    const pctText = pct < 0.001 && bytes > 0 ? "<0.001%" : pct.toFixed(pct >= 1 ? 2 : 3) + "%";

    const logMax = Math.log10(Math.max(10, state.maxFileSize));
    const logVal = bytes > 0 ? Math.log10(bytes + 1) : 0;
    const barW = Math.max(bytes > 0 ? 4 : 0, Math.min(100, (logVal / logMax) * 100));
    const units = (I18N[lang] || I18N.EN).unitLetters;
    const uIdx = !bytes || bytes <= 0 ? 0 : Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
    const shortVal = !bytes || bytes <= 0 ? "0" : Math.round(bytes / Math.pow(1024, uIdx));
    const meterBadge = `${shortVal}${units[uIdx]}`;

    if (mode === "percent") {
      return `<span>${pctText}</span>`;
    }
    if (mode === "meter") {
      return `<div class="size-meter-wrap" title="${escapeHtml(letterText)}"><div class="size-meter-track"><div class="size-meter-fill" style="width:${barW.toFixed(1)}%"></div></div><span class="size-unit-pill">${escapeHtml(meterBadge)}</span></div>`;
    }
    if (mode === "all") {
      return `<div class="size-meter-wrap" title="${escapeHtml(letterText)} (${pctText})"><span>${escapeHtml(letterText)}</span><span style="color:var(--text-muted);font-size:0.8em;">(${pctText})</span><div class="size-meter-track"><div class="size-meter-fill" style="width:${barW.toFixed(1)}%"></div></div></div>`;
    }
    return `<span>${escapeHtml(letterText)}</span>`;
  }

  function renderFileRowHtml(f, filteredIdx, isChild, t, hlFlags, childDepth = 0) {
    const readable = isIndexerReadable(f);
    const badgeCls = `type-badge t-${escapeHtml(f.t)}`;
    const catIco = readable ? (SVG_ICONS[f.t] || SVG_ICONS.other) : SVG_ICONS.unreadable;
    const typeLabel = f.e && f.e !== "-" ? `${(t.cats[f.t] || f.t)} · ${f.e}` : (t.cats[f.t] || f.t);
    const nameHtml = hlFlags.name ? highlightText(f.n, state.query) : escapeHtml(f.n);
    const typeHtml = hlFlags.type ? highlightText(typeLabel, state.query) : escapeHtml(typeLabel);
    const pathHtml = hlFlags.path ? highlightText(f.p, state.query) : escapeHtml(f.p);
    const rowCls = isChild ? ' class="folder-child-row"' : "";
    const nameTitle = readable ? f.n : `${f.n} — ${t.unreadableBadge}`;
    const badgeTitle = readable ? "" : ` title="${escapeHtml(t.unreadableTip)}"`;
    const indentStyle = isChild && childDepth > 0
      ? ` style="padding-left:${30 + Math.min(childDepth, 5) * 16}px;"`
      : "";
    return (
      `<tr${rowCls}>` +
      `<td${indentStyle}><a href="#" class="link-name" data-idx="${filteredIdx}" title="${escapeHtml(nameTitle)}">${catIco}<span>${nameHtml}</span></a></td>` +
      `<td>${formatDate(f.d)}</td>` +
      `<td>${renderSizeCell(f.s)}</td>` +
      `<td><span class="${badgeCls}"${badgeTitle}>${catIco}<span>${typeHtml}</span></span></td>` +
      `<td><span class="link-path" data-pidx="${filteredIdx}" title="${escapeHtml(f.p)}">${SVG_ICONS.folderOpen}<span class="link-path-txt">${pathHtml}</span></span></td>` +
      `</tr>`
    );
  }

  function renderTablePage() {
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    const pageSize = Math.max(1, Number(state.settings.pageSize) || 100);
    const rowsHtml = [];
    const scope = state.searchScope || "all";
    const hlFlags = {
      name: Boolean(state.query.trim() && (scope === "all" || scope === "name")),
      type: Boolean(state.query.trim() && (scope === "all" || scope === "type")),
      path: Boolean(state.query.trim() && (scope === "all" || scope === "path"))
    };

    if (state.viewMode === "folders") {
      const showSub = Boolean(state.settings.showSubfolders);
      const groups = state.folderGroups || [];
      const totalFolders = groups.length;
      const totalPages = Math.max(1, Math.ceil(totalFolders / pageSize));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      const start = (state.page - 1) * pageSize;
      const end = Math.min(totalFolders, start + pageSize);

      for (let gIdx = start; gIdx < end; gIdx++) {
        const g = groups[gIdx];
        const isOpen = state.expandedFolders.has(g.key);
        const chevIco = isOpen ? SVG_ICONS.chevronDown : SVG_ICONS.chevronRight;
        const fldrIco = isOpen ? SVG_ICONS.folderOpen : SVG_ICONS.folderClosed;
        const shownLabel = g.displayName || g.name;
        const grpNameHtml = hlFlags.name || hlFlags.path ? highlightText(shownLabel, state.query) : escapeHtml(shownLabel);
        const grpPathHtml = hlFlags.path ? highlightText(g.fullPath, state.query) : escapeHtml(g.fullPath);
        const safeKeyAttr = escapeHtml(g.key);
        const safePathAttr = escapeHtml(g.fullPath);
        const depthIndent = showSub && g.depth > 0
          ? ` style="padding-left:${10 + Math.min(g.depth, 5) * 16}px;"`
          : "";
        const branchTag = showSub && g.parentListed ? '<span class="folder-depth-branch">└</span>' : "";
        const subCnt = !showSub && g.subfolders ? g.subfolders.size : 0;
        const subBadge = subCnt > 0
          ? `<span class="folder-sub-pill">+${subCnt.toLocaleString()} ${escapeHtml(subCnt === 1 ? t.subfolderSingle : t.subfoldersWord)}</span>`
          : "";

        rowsHtml.push(
          `<tr class="folder-group-row${isOpen ? " is-open" : ""}" data-folder="${safeKeyAttr}">` +
          `<td${depthIndent}><span class="folder-toggle-wrap">${branchTag}${chevIco}${fldrIco}<span class="folder-name-txt" title="${escapeHtml(g.fullPath)}">${grpNameHtml}</span></span></td>` +
          `<td>${formatDate(g.maxDate)}</td>` +
          `<td>${renderSizeCell(g.totalSize)}</td>` +
          `<td><span class="folder-count-pill">${g.files.length.toLocaleString()} ${escapeHtml(t.filesLabel)}</span>${subBadge}</td>` +
          `<td><span class="link-path" data-folder-open="${safePathAttr}" title="${escapeHtml(g.fullPath)}">${SVG_ICONS.folderOpen}<span class="link-path-txt">${grpPathHtml}</span></span></td>` +
          `</tr>`
        );

        if (isOpen) {
          for (let j = 0; j < g.files.length; j++) {
            const cf = g.files[j];
            const fIdx = state.filteredIdxMap.get(cf);
            rowsHtml.push(renderFileRowHtml(cf, fIdx !== undefined ? fIdx : 0, true, t, hlFlags, showSub ? g.depth : 0));
          }
        }
      }

      el("table-body").innerHTML = rowsHtml.join("") || `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--text-muted);">${escapeHtml(t.noMatches)}</td></tr>`;
      el("page-summary").textContent = totalFolders
        ? t.showingFolders(start + 1, end, totalFolders.toLocaleString(), state.filtered.length.toLocaleString())
        : t.showingFolders(0, 0, 0, 0);
      el("page-indicator").textContent = `${state.page} / ${totalPages}`;
      el("btn-prev-page").disabled = state.page <= 1;
      el("btn-next-page").disabled = state.page >= totalPages;
      return;
    }

    const total = state.filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (state.page > totalPages) state.page = totalPages;
    if (state.page < 1) state.page = 1;

    const start = (state.page - 1) * pageSize;
    const end = Math.min(total, start + pageSize);

    for (let i = start; i < end; i++) {
      rowsHtml.push(renderFileRowHtml(state.filtered[i], i, false, t, hlFlags));
    }

    el("table-body").innerHTML = rowsHtml.join("") || `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--text-muted);">${escapeHtml(t.noMatches)}</td></tr>`;
    el("page-summary").textContent = total ? t.showing(start + 1, end, total.toLocaleString()) : t.showing(0, 0, 0);
    el("page-indicator").textContent = `${state.page} / ${totalPages}`;
    el("btn-prev-page").disabled = state.page <= 1;
    el("btn-next-page").disabled = state.page >= totalPages;
  }

  function getFileAccessUrl(fileObj) {
    if (fileObj._blobUrl) return fileObj._blobUrl;
    if (state.serverOnline) {
      return `${SERVER_ORIGIN}/api/file?path=${encodeURIComponent(fileObj.p)}`;
    }
    const norm = fileObj.p.replace(/\\/g, "/");
    return norm.startsWith("/") ? "file://" + norm : "file:///" + norm;
  }

  function cleanupMediaEl(m) {
    if (!m) return;
    m._closing = true;
    try { m.pause(); } catch (_) {}
    try { m.removeAttribute("src"); m.load(); } catch (_) {}
    try { m.remove(); } catch (_) {}
  }

  function isNativePiPActive(v) {
    if (!v) return false;
    if (document.pictureInPictureElement === v) return true;
    if (typeof v.webkitPresentationMode === "string" && v.webkitPresentationMode === "picture-in-picture") return true;
    return false;
  }

  function stopAllPiP() {
    if (document.pictureInPictureElement) {
      try { document.exitPictureInPicture().catch(() => {}); } catch (_) {}
    }
    const dock = el("floating-pip-dock");
    const dockBody = el("floating-pip-body");
    if (dock) dock.classList.remove("open");
    if (dockBody) {
      dockBody.querySelectorAll("video, audio").forEach(cleanupMediaEl);
      dockBody.innerHTML = "";
    }
    const park = el("pip-parking");
    if (park) {
      park.querySelectorAll("video, audio").forEach(cleanupMediaEl);
      park.innerHTML = "";
    }
    state.pipVideo = null;
    state.pipFile = null;
    state.pipFileIdx = -1;
  }

  function stopStageMedia(preservePiP = false) {
    const stage = el("player-stage");
    if (!stage) return;
    stage.querySelectorAll("video, audio").forEach(m => {
      if (preservePiP && m.tagName === "VIDEO" && isNativePiPActive(m)) {
        const park = el("pip-parking");
        if (park) {
          park.appendChild(m);
          return;
        }
      }
      cleanupMediaEl(m);
    });
    stage.innerHTML = "";
  }

  function enterFloatingMiniPiP(v, f, filteredIdx) {
    const dock = el("floating-pip-dock");
    const dockBody = el("floating-pip-body");
    const dockTitle = el("floating-pip-title");
    if (!dock || !dockBody || !v) return;
    dockBody.querySelectorAll("video, audio").forEach(cleanupMediaEl);
    dockBody.innerHTML = "";
    if (dockTitle) dockTitle.textContent = (f && f.n) || "PiP";
    dockBody.appendChild(v);
    dock.classList.add("open");
    state.pipVideo = v;
    state.pipFile = f;
    state.pipFileIdx = filteredIdx;
    el("modal-player").classList.remove("open");
    stopStageMedia(false);
    try { v.play().catch(() => {}); } catch (_) {}
  }

  function restoreFloatingPiPToModal() {
    const v = state.pipVideo;
    const f = state.pipFile;
    const dock = el("floating-pip-dock");
    if (!v || !f) {
      stopAllPiP();
      return;
    }
    const idx = state.filteredIdxMap.has(f) ? state.filteredIdxMap.get(f) : state.pipFileIdx;
    if (dock) dock.classList.remove("open");
    state.pipVideo = null;
    state.pipFile = null;
    state.pipFileIdx = -1;
    openPlayerModal(idx >= 0 ? idx : 0, v);
  }

  async function toggleVideoPiP(v, f, filteredIdx, pipBtn) {
    if (!v) return;
    if (document.pictureInPictureElement === v) {
      try { await document.exitPictureInPicture(); } catch (_) {}
      if (pipBtn) pipBtn.classList.remove("pip-active");
      return;
    }
    if (typeof v.webkitSetPresentationMode === "function" && v.webkitPresentationMode === "picture-in-picture") {
      try { v.webkitSetPresentationMode("inline"); } catch (_) {}
      if (pipBtn) pipBtn.classList.remove("pip-active");
      return;
    }
    if (document.pictureInPictureEnabled && typeof v.requestPictureInPicture === "function") {
      try {
        await v.requestPictureInPicture();
        state.pipVideo = v;
        state.pipFile = f;
        state.pipFileIdx = filteredIdx;
        if (pipBtn) pipBtn.classList.add("pip-active");
        return;
      } catch (_) {}
    }
    if (typeof v.webkitSetPresentationMode === "function") {
      try {
        v.webkitSetPresentationMode("picture-in-picture");
        state.pipVideo = v;
        state.pipFile = f;
        state.pipFileIdx = filteredIdx;
        if (pipBtn) pipBtn.classList.add("pip-active");
        return;
      } catch (_) {}
    }
    enterFloatingMiniPiP(v, f, filteredIdx);
  }

  function renderUnreadableStage(stage, f) {
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    const ext = (f.e || "").toLowerCase();
    stage.innerHTML =
      `<div class="unreadable-stage-card">` +
      `<div>${SVG_ICONS.unreadableLarge}</div>` +
      `<span class="unreadable-stage-pill">${SVG_ICONS.unreadable}<span>${escapeHtml(t.unreadableBadge)}</span></span>` +
      `<div style="font-weight:700;font-size:1.05em;word-break:break-word;">${escapeHtml(f.n)}</div>` +
      `<div style="color:#cbd5e1;font-size:0.88em;line-height:1.45;">${escapeHtml(t.unreadableMsg(ext))}</div>` +
      `<div style="color:#94a3b8;font-size:0.8em;font-family:ui-monospace,Consolas,monospace;word-break:break-all;">${escapeHtml(f.p)}</div>` +
      `<button class="hdr-btn primary" id="btn-stage-open-dir" style="margin-top:6px;">${SVG_ICONS.folderOpen}<span>${escapeHtml(t.openDir)}</span></button>` +
      `</div>`;
    const btn = el("btn-stage-open-dir");
    if (btn) btn.onclick = () => openFolderLocation(f.p);
  }

  function markRuntimeUnreadable(f, stage) {
    if (!f) return;
    if (f.p) state.runtimeUnreadable.add(f.p);
    renderCategoryPills();
    renderTablePage();
    if (stage && el("modal-player").classList.contains("open")) {
      renderUnreadableStage(stage, f);
    }
  }

  function openPlayerModal(filteredIdx, reusedVideo = null) {
    const f = state.filtered[filteredIdx];
    if (!f) return;
    const t = I18N[normalizeLang(state.settings.lang)] || I18N.EN;
    state.playerIdx = filteredIdx;
    el("player-title").textContent = f.n;
    el("player-meta").textContent = `${formatBytes(f.s, state.settings.lang)} · ${formatDate(f.d)} · ${f.p}`;
    el("btn-player-prev").disabled = filteredIdx <= 0;
    el("btn-player-next").disabled = filteredIdx + 1 >= state.filtered.length;

    if (!reusedVideo) {
      stopAllPiP();
    }
    stopStageMedia(false);
    const stage = el("player-stage");
    const url = getFileAccessUrl(f);
    const ext = (f.e || "").toLowerCase();

    if (!isIndexerReadable(f)) {
      renderUnreadableStage(stage, f);
      el("modal-player").classList.add("open");
      return;
    }

    if (f.t === "video") {
      const v = reusedVideo || document.createElement("video");
      if (!reusedVideo) {
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        v.disablePictureInPicture = false;
        v.src = url;
        v.addEventListener("error", () => {
          if (v._closing) return;
          stopAllPiP();
          markRuntimeUnreadable(f, stage);
        });
        v.addEventListener("leavepictureinpicture", () => {
          const park = el("pip-parking");
          const pb = el("btn-video-pip");
          if (pb) pb.classList.remove("pip-active");
          if (park && v.parentNode === park) {
            cleanupMediaEl(v);
            if (state.pipVideo === v) {
              state.pipVideo = null;
              state.pipFile = null;
              state.pipFileIdx = -1;
            }
          }
        });
      }
      stage.appendChild(v);

      const ctrlBar = document.createElement("div");
      ctrlBar.className = "video-ctrl-bar";
      const spdBtns = [];
      for (const spd of [0.5, 1, 1.25, 1.5, 2]) {
        const b = document.createElement("button");
        b.className = Math.abs((v.playbackRate || 1) - spd) < 0.01 ? "hdr-btn spd-active" : "hdr-btn";
        b.textContent = spd + "x";
        b.onclick = () => {
          v.playbackRate = spd;
          spdBtns.forEach(x => x.classList.remove("spd-active"));
          b.classList.add("spd-active");
        };
        spdBtns.push(b);
        ctrlBar.appendChild(b);
      }
      const pipBtn = document.createElement("button");
      pipBtn.id = "btn-video-pip";
      pipBtn.className = isNativePiPActive(v) ? "hdr-btn pip-active" : "hdr-btn";
      pipBtn.title = t.pipTip;
      pipBtn.innerHTML = `${SVG_ICONS.pip}<span>${escapeHtml(t.pipBtn)}</span>`;
      pipBtn.onclick = () => toggleVideoPiP(v, f, filteredIdx, pipBtn);
      ctrlBar.appendChild(pipBtn);
      stage.appendChild(ctrlBar);
    } else if (f.t === "audio") {
      stage.innerHTML = `<div class="audio-stage"><div class="eq-bars"><span></span><span></span><span></span><span></span><span></span></div><div style="font-weight:700;margin-bottom:14px;">${escapeHtml(f.n)}</div><audio controls autoplay style="width:min(520px,100%);" src="${escapeHtml(url)}"></audio></div>`;
      const aud = stage.querySelector("audio");
      if (aud) {
        aud.addEventListener("error", () => {
          if (aud._closing) return;
          markRuntimeUnreadable(f, stage);
        });
      }
    } else if (f.t === "image") {
      let zoom = 1, rot = 0;
      const img = document.createElement("img");
      img.src = url;
      img.alt = f.n;
      img.addEventListener("error", () => {
        markRuntimeUnreadable(f, stage);
      });

  function categorizeExt(lowExt) {
    if ([".mp4",".mkv",".avi",".mov",".webm",".wmv",".flv",".m4v",".mpg",".mpeg",".3gp",".3g2",".ogv"].includes(lowExt)) return "video";
    if ([".mp3",".wav",".flac",".aac",".ogg",".oga",".m4a",".m4b",".m4p",".wma",".opus",".aif",".aiff",".mid",".midi"].includes(lowExt)) return "audio";
    if ([".jpg",".jpeg",".png",".gif",".webp",".svg",".bmp",".ico",".tif",".tiff",".avif",".heic",".heif"].includes(lowExt)) return "image";
    if (lowExt === ".pdf") return "pdf";
    if ([".doc",".docx",".xls",".xlsx",".ppt",".pptx",".odt",".ods",".odp",".txt",".md",".csv",".rtf",".log",".epub"].includes(lowExt)) return "doc";
    if ([".py",".js",".ts",".jsx",".tsx",".html",".htm",".css",".scss",".json",".xml",".yaml",".yml",".c",".cpp",".h",".hpp",".ino",".java",".kt",".go",".rs",".php",".sh",".bat",".ps1",".sql",".vbs"].includes(lowExt)) return "code";
    if ([".zip",".rar",".7z",".tar",".gz",".bz2",".xz",".zst",".iso",".dmg"].includes(lowExt)) return "archive";
    if ([".exe",".msi",".apk",".dll",".appx",".sys",".so"].includes(lowExt)) return "exe";
    return "other";
  }

  function ingestLocalEntries(entries, rootHint) {
    if (!entries || !entries.length) return;
    for (const url of state.objectUrlMap.values()) {
      try { URL.revokeObjectURL(url); } catch (_) {}
    }
    state.objectUrlMap.clear();
    const mapped = entries.map(({ file, rel }) => {
      const fname = file.name || "file";
      const relPath = rel || fname;
      const dotIdx = fname.lastIndexOf(".");
      const ext = dotIdx > 0 ? fname.slice(dotIdx + 1).toUpperCase() : "-";
      const low = dotIdx > 0 ? fname.slice(dotIdx).toLowerCase() : "";
      const blobUrl = URL.createObjectURL(file);
      state.objectUrlMap.set(relPath, blobUrl);
      return {
        n: fname,
        d: Math.floor((file.lastModified || Date.now()) / 1000),
        s: file.size || 0,
        t: categorizeExt(low),
        e: ext,
        p: relPath,
        r: relPath,
        _blobUrl: blobUrl
      };
    });
    const cleanHint = String(rootHint || "Local Folder").replace(/^[\/\\]+|[\/\\]+$/g, "") || "Local Folder";
    const sum = mapped.reduce((a, x) => a + x.s, 0);
    const knownDrives = state.drives && state.drives.length ? state.drives : (window.FILES_INDEX_DATA && window.FILES_INDEX_DATA.drives) || [];
    const upperHint = cleanHint.toUpperCase();
    const matchedDrive = knownDrives.find(dr => {
      const lbl = String(dr.label || "").trim().toUpperCase();
      const drv = String(dr.drive || "").replace(/[\\\/]/g, "").toUpperCase();
      return (lbl && lbl === upperHint) || drv === upperHint || `${drv}:` === upperHint;
    });
    state.customDropMode = true;
    state.manualDriveSwitch = false;
    loadIndexPayload({
      root: matchedDrive ? matchedDrive.root : cleanHint,
      drive: matchedDrive || { drive: cleanHint.endsWith(":") ? cleanHint + "\\" : cleanHint + "/", root: cleanHint, total: 0, used: sum, free: 0, percent_used: 100, label: "", kind: "unknown" },
      drives: knownDrives,
      total_size: sum,
      files: mapped
    });
    showToast((I18N[normalizeLang(state.settings.lang)] || I18N.EN).reloaded(mapped.length));
  }

  function handleDirectoryPicker(fileList) {
    let files = Array.from(fileList || []);
    if (!files.length) return;
    const rootName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "Local Folder";
    if (state.settings.excludeSystem !== false) {
      files = files.filter(f => {
        if (shouldSkipFile(f.name)) return false;
        const parts = (f.webkitRelativePath || f.name).split("/");
        for (let i = 1; i < parts.length - 1; i++) {
          if (shouldSkipDir(parts[i])) return false;
        }
        return true;
      });
    }
    const entries = files.map(f => ({ file: f, rel: f.webkitRelativePath || f.name }));
    ingestLocalEntries(entries, rootName);
  }

  function readAllDirectoryEntries(dirEntry) {
    return new Promise((resolve) => {
      const reader = dirEntry.createReader();
      const all = [];
      const pump = () => {
        reader.readEntries((batch) => {
          if (!batch || !batch.length) {
            resolve(all);
          } else {
            all.push(...batch);
            pump();
          }
        }, () => resolve(all));
      };
      pump();
    });
  }

  async function traverseEntry(entry, prefix, acc) {
    if (!entry) return;
    const excl = state.settings.excludeSystem !== false;
    if (entry.isFile) {
      if (excl && shouldSkipFile(entry.name)) return;
      await new Promise((resolve) => {
        entry.file((f) => {
          const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
          acc.push({ file: f, rel });
          resolve();
        }, () => resolve());
      });
    } else if (entry.isDirectory) {
      const lowDir = String(entry.name || "").toLowerCase();
      if (lowDir === "$recycle.bin" || lowDir === "system volume information" || lowDir === "_osiris_quarantine" || lowDir === "_osiris_runtime") return;
      if (prefix && excl && shouldSkipDir(entry.name)) return;
      const nextPrefix = prefix ? `${prefix}/${entry.name}` : entry.name;
      const children = await readAllDirectoryEntries(entry);
      for (const ch of children) {
        await traverseEntry(ch, nextPrefix, acc);
      }
    }
  }

  async function handleDroppedDataTransfer(dt) {
    const t = I18N[state.settings.lang] || I18N.EN;
    showToast(t.scanningDrop, 4000);
    const items = dt && dt.items ? Array.from(dt.items) : [];
    const fsEntries = items
      .map(it => (typeof it.webkitGetAsEntry === "function" ? it.webkitGetAsEntry() : null))
      .filter(Boolean);

    if (fsEntries.length) {
      const collected = [];
      for (const entry of fsEntries) {
        await traverseEntry(entry, "", collected);
      }
      if (collected.length) {
        const rootHint = fsEntries.length === 1 ? fsEntries[0].name : "Dropped Files";
        ingestLocalEntries(collected, rootHint);
        return;
      }
    }

    const rawFiles = dt && dt.files ? Array.from(dt.files) : [];
    if (rawFiles.length) {
      const entries = rawFiles.map(f => ({ file: f, rel: f.webkitRelativePath || f.name }));
      ingestLocalEntries(entries, rawFiles.length === 1 ? rawFiles[0].name : "Dropped Files");
    }
  }

  function startCanvasAnim(stepFn, durationMs) {
    const c = el("fx-canvas");
    const ctx = c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    c.style.display = "block";
    const start = performance.now();
    if (startCanvasAnim._raf) cancelAnimationFrame(startCanvasAnim._raf);
    function frame(now) {
      const elapsed = now - start;
      stepFn(ctx, c.width, c.height, elapsed);
      if (elapsed < durationMs) {
        startCanvasAnim._raf = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, c.width, c.height);
        c.style.display = "none";
      }
    }
    startCanvasAnim._raf = requestAnimationFrame(frame);
  }

  function runStarfieldCanvas() {
    const stars = Array.from({ length: 140 }, () => ({
      x: (Math.random() - 0.5) * window.innerWidth,
      y: (Math.random() - 0.5) * window.innerHeight,
      z: Math.random() * window.innerWidth
    }));
    startCanvasAnim((ctx, w, h) => {
      ctx.fillStyle = "rgba(2, 6, 23, 0.28)";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#38bdf8";
      const cx = w / 2, cy = h / 2;
      for (const s of stars) {
        s.z -= 26;
        if (s.z <= 1) s.z = w;
        const px = (s.x / s.z) * w + cx;
        const py = (s.y / s.z) * h + cy;
        const r = Math.max(1, (1 - s.z / w) * 4);
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }, 2400);
  }
